<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consentimiento de Pago - EWE Esentia</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
        --primary: #14532d;
        --primary-light: #16a34a;
        --gold: #b8860b;
        --gold-light: #d4a017;
        --bg: #f0fdf4;
        --card-bg: rgba(255, 255, 255, 0.85);
        --border: #d1d5db;
        --text: #1f2937;
        --text-light: #6b7280;
        --success: #16a34a;
        --danger: #dc2626;
        --warning: #d97706;
    }
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #14532d 0%, #16a34a 50%, #b8860b 100%);
        min-height: 100vh;
        color: var(--text);
        padding: 16px;
        position: relative;
        overflow-x: hidden;
    }
    body::before {
        content: '';
        position: fixed;
        inset: 0;
        background:
            radial-gradient(circle at 20% 30%, rgba(212, 160, 23, 0.3) 0%, transparent 50%),
            radial-gradient(circle at 80% 70%, rgba(22, 163, 74, 0.3) 0%, transparent 50%);
        pointer-events: none;
        z-index: 0;
    }
    .container {
        max-width: 720px;
        margin: 0 auto;
        position: relative;
        z-index: 1;
    }
    .header {
        background: var(--card-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 20px;
        padding: 24px;
        text-align: center;
        margin-bottom: 16px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
    }
    .logo {
        font-size: 3rem;
        margin-bottom: 8px;
    }
    .header h1 {
        color: var(--primary);
        font-size: 1.6rem;
        margin-bottom: 4px;
        font-weight: 700;
    }
    .header .subtitle {
        color: var(--gold);
        font-size: 0.95rem;
        font-weight: 600;
        letter-spacing: 1px;
    }
    .header .desc {
        color: var(--text-light);
        font-size: 0.85rem;
        margin-top: 8px;
    }
    .card {
        background: var(--card-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 16px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }
    .card-title {
        color: var(--primary);
        font-size: 1.1rem;
        font-weight: 700;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding-bottom: 8px;
        border-bottom: 2px solid var(--gold);
    }
    .client-info {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }
    .info-item {
        background: rgba(255, 255, 255, 0.6);
        padding: 10px 12px;
        border-radius: 10px;
        border-left: 3px solid var(--gold);
    }
    .info-item .label {
        font-size: 0.72rem;
        color: var(--text-light);
        text-transform: uppercase;
        font-weight: 600;
        letter-spacing: 0.5px;
    }
    .info-item .value {
        font-size: 0.95rem;
        color: var(--text);
        font-weight: 600;
        margin-top: 2px;
        word-break: break-word;
    }
    .policy-box {
        background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
        border: 1px solid #facc15;
        border-radius: 12px;
        padding: 16px;
        font-size: 0.88rem;
        line-height: 1.55;
        color: #3f3f46;
        white-space: pre-wrap;
        max-height: 380px;
        overflow-y: auto;
        font-family: 'Segoe UI', sans-serif;
    }
    .policy-box::-webkit-scrollbar { width: 8px; }
    .policy-box::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); border-radius: 4px; }
    .policy-box::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 4px; }
    .check-group {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        background: rgba(22, 163, 74, 0.08);
        border: 1px solid rgba(22, 163, 74, 0.3);
        border-radius: 12px;
        padding: 14px;
        margin: 16px 0;
        cursor: pointer;
        transition: all 0.2s;
    }
    .check-group:hover { background: rgba(22, 163, 74, 0.15); }
    .check-group input {
        width: 22px;
        height: 22px;
        margin-top: 2px;
        cursor: pointer;
        accent-color: var(--success);
        flex-shrink: 0;
    }
    .check-group span {
        font-size: 0.9rem;
        color: var(--text);
        line-height: 1.4;
    }
    .signature-wrap {
        background: #fff;
        border: 2px dashed var(--gold);
        border-radius: 12px;
        padding: 8px;
        position: relative;
        margin-top: 10px;
    }
    .signature-wrap canvas {
        width: 100%;
        height: 140px;
        display: block;
        touch-action: none;
        cursor: crosshair;
    }
    .signature-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 8px;
        font-size: 0.78rem;
        color: var(--text-light);
    }
    .btn {
        padding: 12px 24px;
        border: none;
        border-radius: 10px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.25s;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        justify-content: center;
    }
    .btn-primary {
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
        color: #fff;
        box-shadow: 0 4px 14px rgba(20, 83, 45, 0.35);
    }
    .btn-primary:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(20, 83, 45, 0.45);
    }
    .btn-primary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }
    .btn-secondary {
        background: rgba(255, 255, 255, 0.8);
        color: var(--primary);
        border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: #fff; }
    .btn-gold {
        background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
        color: #fff;
        box-shadow: 0 4px 14px rgba(184, 134, 11, 0.35);
    }
    .btn-gold:hover { transform: translateY(-2px); }
    .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: flex-end;
        margin-top: 10px;
    }
    .loading {
        text-align: center;
        padding: 40px 20px;
        color: #fff;
    }
    .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top-color: var(--gold-light);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-box {
        background: rgba(220, 38, 38, 0.15);
        border: 1px solid rgba(220, 38, 38, 0.4);
        color: #fff;
        padding: 20px;
        border-radius: 12px;
        text-align: center;
        backdrop-filter: blur(10px);
    }
    .error-box h2 { margin-bottom: 10px; }
    .success-screen {
        text-align: center;
        padding: 30px 20px;
    }
    .success-icon {
        font-size: 5rem;
        margin-bottom: 16px;
        animation: pop 0.6s ease;
    }
    @keyframes pop {
        0% { transform: scale(0); }
        60% { transform: scale(1.2); }
        100% { transform: scale(1); }
    }
    .success-screen h2 {
        color: var(--primary);
        margin-bottom: 10px;
    }
    .success-screen p {
        color: var(--text-light);
        margin-bottom: 8px;
    }
    .receipt {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 16px;
        margin: 20px 0;
        text-align: left;
        font-size: 0.85rem;
    }
    .receipt-row {
        display: flex;
        justify-content: space-between;
        padding: 6px 0;
        border-bottom: 1px dashed #e5e7eb;
    }
    .receipt-row:last-child { border-bottom: none; }
    .receipt-row .label { color: var(--text-light); }
    .receipt-row .value { font-weight: 600; color: var(--text); }
    .signature-preview {
        margin-top: 12px;
        text-align: center;
    }
    .signature-preview img {
        max-width: 100%;
        max-height: 80px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: #fff;
        padding: 4px;
    }
    .footer {
        text-align: center;
        color: rgba(255, 255, 255, 0.85);
        font-size: 0.8rem;
        padding: 16px;
        margin-top: 10px;
    }
    .badge-version {
        display: inline-block;
        background: rgba(255, 255, 255, 0.25);
        color: #fff;
        padding: 3px 10px;
        border-radius: 20px;
        font-size: 0.72rem;
        margin-top: 6px;
    }
    @media (max-width: 600px) {
        .client-info { grid-template-columns: 1fr; }
        .header h1 { font-size: 1.3rem; }
        .card { padding: 16px; }
    }
    @media print {
        body { background: #fff; }
        body::before { display: none; }
        .no-print { display: none !important; }
        .card { box-shadow: none; border: 1px solid #ccc; }
    }
</style>
</head>
<body>

<div class="container" id="app">
    <div class="loading" id="loadingScreen">
        <div class="spinner"></div>
        <h2>Verificando enlace...</h2>
        <p>Por favor espere un momento</p>
    </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<script>
// ==========================================
// CONFIGURACIÓN FIREBASE (misma que factura.js)
// ==========================================
const firebaseConfig = {
    apiKey: "AIzaSyDuMNZrLgxBs6CbuPp8j0iyynejt6WCpnQ",
    authDomain: "esentiacreditos-8345f.firebaseapp.com",
    projectId: "esentiacreditos-8345f",
    storageBucket: "esentiacreditos-8345f.firebasestorage.app",
    messagingSenderId: "888658236080",
    appId: "1:888658236080:web:506e5e2085b5a452dba175"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ==========================================
// POLÍTICA DE MORA (debe coincidir con factura.js)
// ==========================================
const MORA_POLICY = {
    version: 'EWE-MORA-2026-11-V1',
    graceBusinessDays: 15,
    firstPercent: 1.5,
    secondPercent: 2,
    maxPercent: 3.5,
    businessDaysFirstCharge: 16,
    businessDaysSecondCharge: 31
};

function getMoraPolicyPlainText() {
    return `CONSENTIMIENTO INFORMADO DE CONDICIONES DE PAGO Y CARGOS POR MORA

Los precios indicados en la factura corresponden a condiciones de pago de contado. El cliente se compromete a cancelar el monto total adeudado dentro de un plazo máximo de quince (15) días hábiles contados a partir de la fecha de emisión de la factura.

Si la factura no ha sido cancelada dentro de ese plazo, EWE Esentia podrá aplicar cargos por mora sobre el saldo pendiente, de la siguiente manera:

• De 0 a 15 días hábiles desde la fecha de factura: sin recargo.
• A partir de 16 días hábiles: recargo del 1.5% sobre el saldo pendiente.
• Al superar 30 días hábiles: se suma un 2% adicional, para un total acumulado de 3.5%.
• A los 45 días o más: el recargo acumulado será de 3.5%, salvo condiciones especiales previamente acordadas.

Los recargos se calculan únicamente sobre el saldo pendiente y no sobre montos ya abonados.

El cliente declara que ha sido informado claramente sobre estas condiciones, que las comprende y que las acepta para sus compras pendientes de pago.`;
}

// ==========================================
// PARÁMETROS URL
// ==========================================
function getUrlParam(name) {
    const params = new URLSearchParams(window.location.search);
    return params.get(name);
}

// ==========================================
// ESTADO GLOBAL
// ==========================================
let currentClient = null;
let currentToken = null;
let currentInvoice = null;
let signatureCanvas = null;
let signatureCtx = null;
let isDrawing = false;
let hasSignature = false;

// ==========================================
// INICIO
// ==========================================
document.addEventListener('DOMContentLoaded', async () => {
    const token = getUrlParam('token');
    const clientId = getUrlParam('c');
    const invoiceId = getUrlParam('f');

    if (!token || !clientId) {
        showError('Enlace inválido', 'Este enlace no contiene los datos necesarios. Solicite uno nuevo desde el sistema de facturación.');
        return;
    }

    currentToken = token;

    try {
        // Validar token en Firebase
        const tokenDoc = await db.collection('consent_tokens').doc(token).get();
        if (!tokenDoc.exists) {
            showError('Enlace expirado o inválido', 'Este enlace ya no es válido. Por favor solicite uno nuevo al administrador de EWE Esentia.');
            return;
        }
        const tokenData = tokenDoc.data();

        // Verificar que el cliente coincide
        if (tokenData.clienteId !== clientId) {
            showError('Datos no coinciden', 'El enlace no corresponde al cliente indicado.');
            return;
        }

        // Verificar versión
        if (tokenData.version !== MORA_POLICY.version) {
            showError('Versión desactualizada', 'Este enlace corresponde a una versión anterior de la política. Solicite uno nuevo.');
            return;
        }

        // Verificar si ya aceptó
        if (tokenData.aceptado === true) {
            showAlreadyAccepted(tokenData);
            return;
        }

        // Cargar cliente
        const clientDoc = await db.collection('clientesBD').doc(clientId).get();
        if (!clientDoc.exists) {
            showError('Cliente no encontrado', 'No se encontró el registro del cliente.');
            return;
        }
        currentClient = { id: clientDoc.id, ...clientDoc.data() };

        // Cargar factura si existe
        if (invoiceId) {
            const invDoc = await db.collection('facturas').doc(invoiceId).get();
            if (invDoc.exists) currentInvoice = { id: invDoc.id, ...invDoc.data() };
        }

        renderConsentForm();
    } catch (error) {
        console.error('Error:', error);
        showError('Error de conexión', 'No se pudo verificar el enlace. Revise su conexión a internet e intente nuevamente.');
    }
});

// ==========================================
// RENDERIZADO
// ==========================================
function renderConsentForm() {
    const app = document.getElementById('app');
    const invoiceInfo = currentInvoice
        ? `<div class="info-item">
                <div class="label">Factura</div>
                <div class="value">${currentInvoice.numero || 'S/N'}</div>
           </div>
           <div class="info-item">
                <div class="label">Total</div>
                <div class="value">₡${formatMoney(currentInvoice.total || 0)}</div>
           </div>`
        : '';

    app.innerHTML = `
        <div class="header">
            <div class="logo">🌿</div>
            <h1>EWE ESENTIA</h1>
            <div class="subtitle">Aromaterapia • Candelas • Difusores</div>
            <div class="desc">Consentimiento informado de condiciones de pago</div>
            <div class="badge-version">Versión ${MORA_POLICY.version}</div>
        </div>

        <div class="card">
            <div class="card-title">👤 Datos del Cliente</div>
            <div class="client-info">
                <div class="info-item">
                    <div class="label">Nombre</div>
                    <div class="value">${currentClient.nombre || 'N/A'}</div>
                </div>
                <div class="info-item">
                    <div class="label">Cédula</div>
                    <div class="value">${currentClient.cedula || 'N/A'}</div>
                </div>
                <div class="info-item">
                    <div class="label">Teléfono</div>
                    <div class="value">${currentClient.telefono || 'N/A'}</div>
                </div>
                ${invoiceInfo}
            </div>
        </div>

        <div class="card">
            <div class="card-title">📋 Condiciones de Pago y Cargos por Mora</div>
            <p style="font-size:0.85rem;color:var(--text-light);margin-bottom:10px;">
                Por favor lea detenidamente las siguientes condiciones antes de aceptar:
            </p>
            <div class="policy-box" id="policyText">${getMoraPolicyPlainText()}</div>
        </div>

        <div class="card">
            <div class="card-title">✍️ Firma Digital (opcional)</div>
            <p style="font-size:0.85rem;color:var(--text-light);margin-bottom:8px;">
                Puede firmar con el dedo o el mouse para mayor formalidad:
            </p>
            <div class="signature-wrap">
                <canvas id="signatureCanvas"></canvas>
            </div>
            <div class="signature-actions">
                <span>Dibuje su firma en el recuadro</span>
                <button type="button" class="btn btn-secondary" style="padding:6px 12px;font-size:0.8rem;" onclick="clearSignature()">🗑️ Limpiar</button>
            </div>
        </div>

        <div class="card">
            <label class="check-group" for="acceptCheck">
                <input type="checkbox" id="acceptCheck" onchange="updateSubmitBtn()">
                <span>
                    <strong>Declaro que he leído y comprendido las condiciones de pago y cargos por mora descritas anteriormente.</strong><br>
                    Acepto voluntariamente estas condiciones para mis compras pendientes de pago en EWE Esentia.
                </span>
            </label>

            <div class="actions">
                <button type="button" class="btn btn-primary" id="submitBtn" disabled onclick="submitConsent()">
                    ✅ Registrar mi aceptación
                </button>
            </div>
        </div>

        <div class="footer no-print">
            <p>© ${new Date().getFullYear()} EWE Esentia · Cartago, Costa Rica</p>
            <p>📞 7295-2454 · SINPE Móvil: 7295-2454</p>
        </div>
    `;

    initSignatureCanvas();
}

// ==========================================
// FIRMA DIGITAL
// ==========================================
function initSignatureCanvas() {
    signatureCanvas = document.getElementById('signatureCanvas');
    if (!signatureCanvas) return;

    const rect = signatureCanvas.getBoundingClientRect();
    signatureCanvas.width = rect.width;
    signatureCanvas.height = 140;
    signatureCtx = signatureCanvas.getContext('2d');
    signatureCtx.strokeStyle = '#14532d';
    signatureCtx.lineWidth = 2.5;
    signatureCtx.lineCap = 'round';
    signatureCtx.lineJoin = 'round';

    // Mouse
    signatureCanvas.addEventListener('mousedown', startDraw);
    signatureCanvas.addEventListener('mousemove', draw);
    signatureCanvas.addEventListener('mouseup', endDraw);
    signatureCanvas.addEventListener('mouseleave', endDraw);

    // Touch
    signatureCanvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        const mouseEvent = new MouseEvent('mousedown', {
            clientX: touch.clientX,
            clientY: touch.clientY
        });
        signatureCanvas.dispatchEvent(mouseEvent);
    });
    signatureCanvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        const mouseEvent = new MouseEvent('mousemove', {
            clientX: touch.clientX,
            clientY: touch.clientY
        });
        signatureCanvas.dispatchEvent(mouseEvent);
    });
    signatureCanvas.addEventListener('touchend', (e) => {
        e.preventDefault();
        signatureCanvas.dispatchEvent(new MouseEvent('mouseup'));
    });
}

function getCanvasCoords(e) {
    const rect = signatureCanvas.getBoundingClientRect();
    return {
        x: (e.clientX - rect.left) * (signatureCanvas.width / rect.width),
        y: (e.clientY - rect.top) * (signatureCanvas.height / rect.height)
    };
}

function startDraw(e) {
    isDrawing = true;
    const { x, y } = getCanvasCoords(e);
    signatureCtx.beginPath();
    signatureCtx.moveTo(x, y);
}

function draw(e) {
    if (!isDrawing) return;
    const { x, y } = getCanvasCoords(e);
    signatureCtx.lineTo(x, y);
    signatureCtx.stroke();
    hasSignature = true;
}

function endDraw() {
    isDrawing = false;
}

function clearSignature() {
    if (signatureCtx && signatureCanvas) {
        signatureCtx.clearRect(0, 0, signatureCanvas.width, signatureCanvas.height);
        hasSignature = false;
    }
}

function updateSubmitBtn() {
    const check = document.getElementById('acceptCheck');
    const btn = document.getElementById('submitBtn');
    if (btn) btn.disabled = !check?.checked;
}

// ==========================================
// ENVIAR CONSENTIMIENTO
// ==========================================
async function submitConsent() {
    const check = document.getElementById('acceptCheck');
    if (!check?.checked) {
        alert('Debe aceptar las condiciones para continuar.');
        return;
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner" style="width:18px;height:18px;border-width:2px;margin:0;"></span> Guardando...';

    try {
        // Obtener firma como imagen
        let firmaDataUrl = null;
        if (hasSignature && signatureCanvas) {
            firmaDataUrl = signatureCanvas.toDataURL('image/png');
        }

        const consentData = {
            clienteId: currentClient.id,
            clienteNombre: currentClient.nombre || '',
            clienteTelefono: currentClient.telefono || '',
            clienteCedula: currentClient.cedula || '',
            facturaId: currentInvoice?.id || null,
            numeroFactura: currentInvoice?.numero || '',
            totalFactura: parseFloat(currentInvoice?.total) || 0,
            canal: 'pagina_publica',
            aceptado: true,
            version: MORA_POLICY.version,
            politica: {
                plazoDiasHabiles: MORA_POLICY.graceBusinessDays,
                primerPorcentaje: MORA_POLICY.firstPercent,
                segundoPorcentaje: MORA_POLICY.secondPercent,
                porcentajeMaximo: MORA_POLICY.maxPercent
            },
            textoAceptado: getMoraPolicyPlainText(),
            firmaDigital: firmaDataUrl,
            fechaLocal: new Date().toISOString(),
            fechaAceptacion: firebase.firestore.FieldValue.serverTimestamp(),
            userAgent: navigator.userAgent || '',
            ip: 'cliente',
            tokenUsado: currentToken
        };

        // Guardar consentimiento
        await db.collection('consentimientos_mora').add(consentData);

        // Actualizar resumen en cliente
        const resumenConsent = {
            aceptado: true,
            version: MORA_POLICY.version,
            fechaLocal: consentData.fechaLocal,
            canal: 'pagina_publica'
        };
        await db.collection('clientesBD').doc(currentClient.id).update({
            consentimientoMora: resumenConsent
        });

        // Marcar token como usado
        await db.collection('consent_tokens').doc(currentToken).update({
            aceptado: true,
            fechaAceptacion: firebase.firestore.FieldValue.serverTimestamp()
        });

        showSuccess(consentData);
    } catch (error) {
        console.error('Error:', error);
        alert('Error al guardar: ' + error.message);
        btn.disabled = false;
        btn.innerHTML = '✅ Registrar mi aceptación';
    }
}

// ==========================================
// PANTALLAS
// ==========================================

        <div class="header">

            <h2>⚠️ ${title}</h2>
            <p>${message}</p>
            <p style="margin-top:16px;font-size:0.85rem;">
                Si necesita ayuda, contáctenos al <strong>7295-2454</strong>
            </p>
        </div>
    `;
}

function showAlreadyAccepted(tokenData) {
    const fecha = tokenData.fechaAceptacion?.toDate
        ? tokenData.fechaAceptacion.toDate().toLocaleString('es-CR')
        : (tokenData.fechaLocal ? new Date(tokenData.fechaLocal).toLocaleString('es-CR') : 'N/A');

    document.getElementById('app').innerHTML = `
        <div class="header">
            <div class="logo">🌿</div>
            <h1>EWE ESENTIA</h1>
            <div class="subtitle">Consentimiento ya registrado</div>
        </div>
        <div class="card">
            <div class="success-screen">
                <div class="success-icon">✅</div>
                <h2>Ya aceptó las condiciones</h2>
                <p>Su consentimiento fue registrado el:</p>
                <p><strong>${fecha}</strong></p>
                <p style="margin-top:12px;font-size:0.85rem;">
                    Versión: ${tokenData.version || MORA_POLICY.version}
                </p>
                <p style="margin-top:16px;">
                    No es necesario aceptar nuevamente.<br>
                    Puede cerrar esta ventana.
                </p>

}

function showSuccess(consentData) {
    const fecha = new Date(consentData.fechaLocal).toLocaleString('es-CR');
    const firmaHtml = consentData.firmaDigital
        ? `<div class="signature-preview">
                <div style="font-size:0.8rem;color:var(--text-light);margin-bottom:6px;">Firma digital:</div>
                <img src="${consentData.firmaDigital}" alt="Firma">
           </div>`
        : '';

    document.getElementById('app').innerHTML = `
        <div class="header">
            <div class="logo">🌿</div>
            <h1>EWE ESENTIA</h1>
            <div class="subtitle">¡Consentimiento registrado!</div>
        </div>

        <div class="card">
            <div class="success-screen">
                <div class="success-icon">✅</div>
                <h2>¡Gracias por su aceptación!</h2>
                <p>Su consentimiento ha sido registrado correctamente.</p>
            </div>

            <div class="receipt" id="receipt">
                <h3 style="text-align:center;color:var(--primary);margin-bottom:12px;">
                    📄 Comprobante de Aceptación
                </h3>
                <div class="receipt-row">
                    <span class="label">Cliente:</span>
                    <span class="value">${consentData.clienteNombre}</span>
                </div>
                <div class="receipt-row">
                    <span class="label">Cédula:</span>
                    <span class="value">${consentData.clienteCedula}</span>
                </div>
                <div class="receipt-row">
                    <span class="label">Teléfono:</span>
                    <span class="value">${consentData.clienteTelefono}</span>
                </div>
                ${consentData.numeroFactura ? `
                <div class="receipt-row">
                    <span class="label">Factura:</span>
                    <span class="value">${consentData.numeroFactura}</span>
                </div>` : ''}
                <div class="receipt-row">
                    <span class="label">Fecha de aceptación:</span>
                    <span class="value">${fecha}</span>
                </div>
                <div class="receipt-row">
                    <span class="label">Versión política:</span>
                    <span class="value">${consentData.version}</span>
                </div>
                <div class="receipt-row">
                    <span class="label">Canal:</span>
                    <span class="value">Página web del cliente</span>
                </div>
                ${firmaHtml}
                <div style="margin-top:16px;padding-top:12px;border-top:2px solid var(--gold);text-align:center;font-size:0.8rem;color:var(--text-light);">
                    <strong>Resumen de condiciones aceptadas:</strong><br>
                    • Plazo sin recargo: 15 días hábiles<br>
                    • Recargo 16-30 días: 1.5%<br>
                    • Recargo 31+ días: 3.5% acumulado
                </div>
            </div>

            <div class="actions no-print" style="justify-content:center;">
                <button class="btn btn-gold" onclick="window.print()">🖨️ Imprimir comprobante</button>
                <button class="btn btn-primary" onclick="sendWhatsAppConfirmation()">📱 Enviar por WhatsApp</button>
            </div>
        </div>

        <div class="footer no-print">
            <p>© ${new Date().getFullYear()} EWE Esentia · Cartago, Costa Rica</p>
            <p>📞 7295-2454</p>
        </div>
    `;
}

function sendWhatsAppConfirmation() {
    if (!currentClient?.telefono) {
        alert('No hay teléfono registrado para enviar el comprobante.');
        return;
    }
    const phone = normalizePhone(currentClient.telefono);
    const fecha = new Date().toLocaleString('es-CR');
    const msg = `🌿 *EWE ESENTIA - Comprobante de aceptación*\n\n` +
        `Hola ${currentClient.nombre} 👋\n\n` +
        `Confirmamos que su consentimiento de condiciones de pago fue registrado:\n\n` +
        `📅 Fecha: ${fecha}\n` +
        `📋 Versión: ${MORA_POLICY.version}\n` +
        `${currentInvoice?.numero ? `📄 Factura: ${currentInvoice.numero}\n` : ''}` +
        `\n¡Gracias por su preferencia! 🙏`;
    window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
}

// ==========================================
// UTILIDADES
// ==========================================
function formatMoney(amount) {
    const value = Number(amount) || 0;
    return value.toFixed(2).replace(/\d(?=(\d{3})+.)/g, '$&,');
}
function normalizePhone(phone) {
    let digits = String(phone || '').replace(/\D/g, '');
    if (digits.length === 8) digits = '506' + digits;
    return digits;
}
