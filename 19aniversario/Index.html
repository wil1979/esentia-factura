<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W & E - 19 años</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="libro-container">
        <div class="portada" id="portada">
            <h1>W & E</h1>
            <p>19 años de historia</p>
            <button onclick="abrirLibro()">Abrir el libro</button>
        </div>
        
        <div class="pagina" id="pagina">
            <div class="contenido-pagina">
                <div class="imagen-container">
                    <img id="imagen-capitulo" src="" alt="">
                </div>
                <div class="texto-container">
                    <h2 id="titulo-capitulo"></h2>
                    <div id="lineas-texto"></div>
                </div>
            </div>
            
            <div class="controles">
                <button onclick="paginaAnterior()" id="btn-anterior">← Anterior</button>
                <span id="indicador-pagina"></span>
                <button onclick="paginaSiguiente()" id="btn-siguiente">Siguiente →</button>
            </div>
        </div>
    </div>
    
    <script src="js/datos.js"></script>
    <script src="js/libro.js"></script>
</body>
</html>
